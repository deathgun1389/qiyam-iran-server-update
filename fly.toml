# Fly.io (untested): fly launch --no-deploy ; fly volumes create qiyam_data --size 1 ; fly deploy
app = "qiyam-server"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  DATA_DIR = "/data"
[[mounts]]
  source = "qiyam_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
